name: Build proxyA.exe

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build single-file exe
        run: python -m PyInstaller --onefile --noconsole --name proxyA proxy_A_app.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxyA-exe
          path: dist/proxyA.exe

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/proxyA.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
